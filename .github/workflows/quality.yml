name: Website quality checks

on:
  pull_request:
  push:
    branches: [redesign-v2, experience-v3, experience-v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run typecheck
      - name: Lint source
        run: npm run lint
      - name: Verify image viewer recovery and controls
        run: npm run check:viewer
      - name: Build static website
        run: npm run build
      - name: Verify generated website
        run: npm run check:site
      # This workflow deliberately has no deployment, push, or Pages permissions.
